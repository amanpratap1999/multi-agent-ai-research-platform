[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-platform"
version = "0.1.0"
description = "Autonomous 4-Agent LangGraph Research Platform with AWS Bedrock Guardrails, pgvector Semantic Caching, and PyRIT Red Teaming"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Prakhar Singh" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.5",
    "langchain-groq>=0.2.1",
    "langchain-aws>=0.2.5",
    "boto3>=1.35.50",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "fastembed>=0.4.1",
    "duckduckgo-search>=6.3.5",
    "trafilatura>=1.12.2",
    "jinja2>=3.1.4",
    "fpdf2>=2.8.1",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "black>=24.10.0",
    "ruff>=0.7.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
per-file-ignores = { "tests/*" = ["E402"] }
