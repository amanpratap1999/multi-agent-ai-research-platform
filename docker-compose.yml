version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research_platform_web
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=research_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_BEDROCK_MOCK=true
      - AWS_REGION=us-east-1
      - PRIMARY_MODEL=gpt-4o
      - FALLBACK_MODEL_1=groq/llama-3.3-70b-versatile
      - FALLBACK_MODEL_2=bedrock/anthropic.claude-3-5-sonnet
      - SEMANTIC_CACHE_SIMILARITY_THRESHOLD=0.95
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: research_platform_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: research_platform_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
